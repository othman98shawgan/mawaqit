name: alfajr
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html

version: 1.0.8+11

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ^3.44.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  intl: ^0.20.2
  timer_builder: ^2.0.0
  jiffy: ^6.4.5
  shared_preferences: ^2.0.15
  flutter_local_notifications: ^22.3.2
  rxdart: ^0.28.0
  url_launcher: ^6.1.7
  provider: ^6.0.5
  settings_ui: ^4.0.2
  permission_handler: ^11.3.1
  flutter_launcher_icons: ^0.14.4
  hijri: ^3.0.0
  app_settings: ^9.0.1
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.2.1
  wakelock_plus: ^1.2.8
  in_app_update: ^5.0.0
  share_plus: ^10.0.0

  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  inno_bundle: ^0.8.0

flutter_icons:
  image_path: "images/logo.png"
  android: true
  ios: true
  windows:
    generate: true
    image_path: "images/logo.png"
    icon_size: 48

inno_bundle:
  id: "0096E8C2-F27B-4878-81FC-DE960F0C687A"
  name: "Mawaqit Al-Quds"
  description: "Mawaqit Al-Quds Prayer Times"
  version: "1.0.8"
  publisher: "Othman"
  icon: "windows/runner/resources/app_icon.ico"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - lib/data/prayer-time.json
    - images/
    - lib/data/mathurat.json

  fonts:
    - family: Tajawal
      fonts:        
        - asset: fonts/Tajawal-Light.ttf
          weight: 300
        - asset: fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: fonts/Tajawal-Bold.ttf
          weight: 700
